name: nback_pro
description: "A scientifically accurate Dual N-Back training app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.1

  # Local Storage (Settings, Stats, Streak)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Authentication (aligned for iOS CocoaPods: GoogleUtilities 8.x)
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_sign_in: ^6.1.6
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.3

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.4
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  share_plus: ^10.0.2

  # In-App Purchase (subscriptions + lifetime)
  in_app_purchase: ^3.2.0

  # Audio
  audioplayers: ^6.5.1

  # UI/Animations
  google_fonts: ^6.2.1
  lottie: ^3.0.0
  fl_chart: ^0.66.0

  # Notifications (for daily reminder)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Secure storage for auth tokens
  flutter_secure_storage: ^9.2.2

  # Keep screen on during game
  wakelock_plus: ^1.2.8

  # App version for Settings (dev mode tap)
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  mocktail: ^1.0.4
  path: ^1.9.0
  firebase_auth_mocks: ^0.15.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/animations/
    - assets/music/
